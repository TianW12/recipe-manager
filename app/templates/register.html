{# register.html — create an account. Email is the login id; username optional. #}
{% extends "base.html" %}
{% block title %}Register — Recipes{% endblock %}
{% block content %}
<article class="auth-card">
  <h1>Create account</h1>
  {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="auth-form">
    <label>Email
      <input type="email" name="email" value="{{ email }}" required autofocus
             autocomplete="email">
    </label>
    <label>Username <span class="optional">(optional, shown instead of your email)</span>
      <input type="text" name="username" value="{{ username }}" autocomplete="username">
    </label>
    <label>Password <span class="optional">(min. 8 characters)</span>
      <input type="password" name="password" required minlength="8"
             autocomplete="new-password">
    </label>
    <label>Repeat password
      <input type="password" name="password2" required minlength="8"
             autocomplete="new-password">
    </label>
    <button class="btn btn-primary" type="submit">Register</button>
  </form>
  <p class="auth-alt">Already have an account? <a href="/login">Log in</a></p>
</article>
{% endblock %}
