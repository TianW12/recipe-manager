{# login.html — email + password sign-in. #}
{% extends "base.html" %}
{% block title %}Log in — Recipes{% endblock %}
{% block content %}
<article class="auth-card">
  <h1>Log in</h1>
  {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="auth-form">
    <label>Email
      <input type="email" name="email" value="{{ email }}" required autofocus
             autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="auth-alt">No account yet? <a href="/register">Register</a></p>
</article>
{% endblock %}
